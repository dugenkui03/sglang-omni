[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-workbench"
version = "0.1.0"
description = "An independent TTS load-testing and server-observation workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
tts-workbench = "tts_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["tts_workbench*"]

[tool.setuptools.package-data]
tts_workbench = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.isort]
profile = "black"
known_first_party = ["tts_workbench"]

[tool.uv]
# Isolate this application from the parent model runtime's dependency overrides.
override-dependencies = []
