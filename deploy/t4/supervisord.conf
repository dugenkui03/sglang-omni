[unix_http_server]
file=/root/data/sglang-omni/operations/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/data/sglang-omni/operations/supervisord.log
pidfile=/root/data/sglang-omni/operations/supervisord.pid
childlogdir=/root/data/sglang-omni/operations

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/data/sglang-omni/operations/supervisor.sock

[program:qwen3-tts]
command=/bin/bash /root/workspace/sglang-omni/deploy/t4/start-inference.sh
directory=/root/workspace/sglang-omni
autostart=true
autorestart=unexpected
startsecs=20
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/data/sglang-omni/operations/server.log
stdout_logfile_maxbytes=0

[program:tts-workbench]
command=/bin/bash /root/workspace/sglang-omni/deploy/t4/start-workbench.sh
directory=/root/workspace/sglang-omni
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/data/sglang-omni/operations/tts-workbench.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
